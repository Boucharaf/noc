events {}

http {
    # Ni la version de nginx dans les en-têtes, ni sur les pages d'erreur.
    server_tokens off;

    # L'API ne reçoit que du JSON de petite taille ; le défaut de 1 Mo est
    # rappelé explicitement pour qu'un ajout futur (téléversement) soit un
    # choix, pas un oubli.
    client_max_body_size 1m;

    # Connexion : 30 requêtes par minute par adresse, rafale de 10. Premier
    # rideau devant le verrouillage applicatif (backend/app/routes/auth.py),
    # qui compte les ÉCHECS. Assez large pour une relève d'équipe où toute la
    # salle se connecte derrière la même adresse NAT.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;
    limit_req_status 429;

    server {
        listen 80;

        # TLS terminé en amont par le FortiGate (VIP nockpi-06.anptic-test.gov.bf).
        # Nginx ne sert que du HTTP en interne — AUCUNE redirection HTTPS ici :
        # une redirection créerait une boucle, le FortiGate rechiffrant
        # systématiquement le retour en HTTPS puis renvoyant du HTTP à nginx.

        # En-têtes de sécurité, posés sur TOUTES les réponses (`always`, y
        # compris les erreurs). Hérités par les blocs location ci-dessous,
        # qui ne doivent donc jamais déclarer leur propre add_header.
        #
        # CSP : scripts et styles servis par le NOC seul ; tuiles de la carte
        # chez OpenStreetMap (SitesMap.jsx) ; `unsafe-inline` pour les styles
        # uniquement, que Leaflet pose à la volée. Aucun script en ligne.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self'; font-src 'self' data:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # La géolocalisation sert au pointage des agents terrain (TerrainView.jsx).
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        # HSTS : n'a de sens que si LE NAVIGATEUR parle TLS directement à ce
        # serveur. Ici c'est le FortiGate qui gère le HTTPS public ; HSTS se
        # configure côté FortiGate si besoin, pas ici.

        # Résolveur DNS interne de Docker (voir commentaire d'origine :
        # nécessaire pour que nginx re-résolve backend/frontend à chaque
        # redéploiement plutôt que de garder une IP morte en cache).
        resolver 127.0.0.11 valid=10s ipv6=off;

        # Connexion par mot de passe et par PIN : limitées en débit. Bloc
        # d'expression régulière, donc prioritaire sur le préfixe /api/.
        location ~ ^/api/auth/(login|pin-login)$ {
            limit_req zone=auth burst=10 nodelay;
            set $api_upstream http://backend:8000;
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            # ÉCRASE tout X-Real-IP envoyé par le client : le backend s'y fie
            # pour ses verrouillages par adresse.
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Le client public est toujours en HTTPS (TLS terminé par le
            # FortiGate) même si nginx ne reçoit que du HTTP ici.
            proxy_set_header X-Forwarded-Proto https;
        }

        location /api/ {
            set $api_upstream http://backend:8000;
            # proxy_pass SANS composant d'URI : l'URI d'origine est
            # transmise telle quelle (/api/... reste /api/...).
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            # La génération d'un rapport mensuel (PDF + DOCX) dépasse la
            # minute sur un gros parc ; le défaut de 60 s la couperait.
            proxy_read_timeout 300s;
        }

        # Flux d'alertes temps réel (nécessite l'upgrade WebSocket)
        location /ws/ {
            set $ws_upstream http://backend:8000;
            proxy_pass $ws_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            # Le backend émet un battement de cœur toutes les 20 s ;
            # 120 s laisse la marge sans garder de sockets mortes.
            proxy_read_timeout 120s;
        }

        location / {
            set $front_upstream http://frontend:80;
            proxy_pass $front_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}