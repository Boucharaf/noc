events {}

http {
    # HTTP -> HTTPS redirect 
    server {
        listen 80;
        return 301 https://$host:8443$request_uri;
    }

    server {
        listen 443 ssl;

        ssl_certificate     /etc/nginx/certs/noc-selfsigned.crt;
        ssl_certificate_key /etc/nginx/certs/noc-selfsigned.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Résolveur DNS interne de Docker.
        #
        # SANS lui, nginx résout « backend » et « frontend » UNE SEULE FOIS,
        # au démarrage, et garde l'adresse IP en cache pour toujours. Or
        # `docker compose up -d backend` recrée le conteneur avec une
        # nouvelle IP : la passerelle continue alors d'appeler l'ancienne
        # et répond 502 sur toute l'API, jusqu'à ce que quelqu'un pense à
        # redémarrer nginx. Autrement dit, chaque redéploiement du backend
        # cassait le NOC en silence.
        #
        # `valid=10s` force la ré-interrogation du DNS, et le passage par
        # une VARIABLE dans proxy_pass est ce qui déclenche réellement la
        # résolution à chaque requête — avec un nom écrit en dur, nginx
        # ignore le résolveur.
        resolver 127.0.0.11 valid=10s ipv6=off;

        location /api/ {
            set $api_upstream http://backend:8000;
            # proxy_pass SANS composant d'URI : l'URI d'origine est
            # transmise telle quelle (/api/... reste /api/...).
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # La génération d'un rapport mensuel (PDF + DOCX) dépasse la
            # minute sur un gros parc ; le défaut de 60 s la couperait.
            proxy_read_timeout 300s;
        }

        # Flux d'alertes temps réel (nécessite l'upgrade WebSocket)
        location /ws/ {
            set $ws_upstream http://backend:8000;
            proxy_pass $ws_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Le backend émet un battement de cœur toutes les 20 s ;
            # 120 s laisse la marge sans garder de sockets mortes.
            proxy_read_timeout 120s;
        }

        location / {
            set $front_upstream http://frontend:80;
            proxy_pass $front_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
