events {}

http {
    # Ni la version de nginx dans les en-têtes, ni sur les pages d'erreur.
    server_tokens off;

    # L'API ne reçoit que du JSON de petite taille ; le défaut de 1 Mo est
    # rappelé explicitement pour qu'un ajout futur (téléversement) soit un
    # choix, pas un oubli.
    client_max_body_size 1m;

    # Connexion : 30 requêtes par minute par adresse, rafale de 10. Premier
    # rideau devant le verrouillage applicatif (backend/app/routes/auth.py),
    # qui compte les ÉCHECS. Assez large pour une relève d'équipe où toute la
    # salle se connecte derrière la même adresse NAT.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;
    limit_req_status 429;

    # HTTP -> HTTPS redirect
    server {
        listen 80;
        return 301 https://$host:8443$request_uri;
    }

    server {
        listen 443 ssl;

        ssl_certificate     /etc/nginx/certs/noc-selfsigned.crt;
        ssl_certificate_key /etc/nginx/certs/noc-selfsigned.key;
        # Profil « intermediate » de Mozilla : TLS 1.2 et 1.3, suites AEAD
        # à confidentialité persistante uniquement.
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # En-têtes de sécurité, posés sur TOUTES les réponses (`always`, y
        # compris les erreurs). Hérités par les blocs location ci-dessous,
        # qui ne doivent donc jamais déclarer leur propre add_header.
        #
        # CSP : scripts et styles servis par le NOC seul ; tuiles de la carte
        # chez OpenStreetMap (SitesMap.jsx) ; `unsafe-inline` pour les styles
        # uniquement, que Leaflet pose à la volée. Aucun script en ligne.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self'; font-src 'self' data:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # La géolocalisation sert au pointage des agents terrain (TerrainView.jsx).
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        # HSTS : à activer UNIQUEMENT avec un certificat reconnu, sur le nom
        # définitif du NOC. Sur localhost, il imposerait HTTPS à toutes les
        # applications de développement du poste pendant un an.
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Résolveur DNS interne de Docker.
        #
        # SANS lui, nginx résout « backend » et « frontend » UNE SEULE FOIS,
        # au démarrage, et garde l'adresse IP en cache pour toujours. Or
        # `docker compose up -d backend` recrée le conteneur avec une
        # nouvelle IP : la passerelle continue alors d'appeler l'ancienne
        # et répond 502 sur toute l'API, jusqu'à ce que quelqu'un pense à
        # redémarrer nginx. Autrement dit, chaque redéploiement du backend
        # cassait le NOC en silence.
        #
        # `valid=10s` force la ré-interrogation du DNS, et le passage par
        # une VARIABLE dans proxy_pass est ce qui déclenche réellement la
        # résolution à chaque requête — avec un nom écrit en dur, nginx
        # ignore le résolveur.
        resolver 127.0.0.11 valid=10s ipv6=off;

        # Connexion par mot de passe et par PIN : limitées en débit. Bloc
        # d'expression régulière, donc prioritaire sur le préfixe /api/.
        location ~ ^/api/auth/(login|pin-login)$ {
            limit_req zone=auth burst=10 nodelay;
            set $api_upstream http://backend:8000;
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            # ÉCRASE tout X-Real-IP envoyé par le client : le backend s'y fie
            # pour ses verrouillages par adresse.
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            set $api_upstream http://backend:8000;
            # proxy_pass SANS composant d'URI : l'URI d'origine est
            # transmise telle quelle (/api/... reste /api/...).
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # La génération d'un rapport mensuel (PDF + DOCX) dépasse la
            # minute sur un gros parc ; le défaut de 60 s la couperait.
            proxy_read_timeout 300s;
        }

        # Flux d'alertes temps réel (nécessite l'upgrade WebSocket)
        location /ws/ {
            set $ws_upstream http://backend:8000;
            proxy_pass $ws_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Le backend émet un battement de cœur toutes les 20 s ;
            # 120 s laisse la marge sans garder de sockets mortes.
            proxy_read_timeout 120s;
        }

        location / {
            set $front_upstream http://frontend:80;
            proxy_pass $front_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
