{#
  Critical-incident alert mail, rendered by app/services/notification_service.py.

  Mail clients strip <style> blocks and understand almost no modern CSS, so the
  layout is nested tables with every rule inlined — deliberately not how the
  dashboard is written. Colours mirror frontend/src/theme/colors.js so an alert
  and the screen it points at agree on what "critique" looks like.

  Autoescaping is on: node names and descriptions come from Zabbix/iTop and are
  never trusted as markup.
#}
<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;padding:0;background:#f1f5f9;">

{# The grey line phones show next to the subject. #}
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">
  {{ node_code }} {{ node_name }} — {{ detected_at }}
</div>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
       style="background:#f1f5f9;padding:24px 12px;">
<tr><td align="center">
<table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"
       style="width:100%;max-width:600px;background:#ffffff;border:1px solid #e2e8f0;
              border-radius:12px;overflow:hidden;
              font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">

  <tr><td style="background:#0f172a;padding:18px 28px;">
    <span style="color:#ffffff;font-size:16px;font-weight:700;letter-spacing:.02em;">NOC ANPTIC</span>
    <span style="color:#94a3b8;font-size:12px;">&nbsp;|&nbsp; Supervision réseau</span>
  </td></tr>

  <tr><td style="background:{{ accent }};height:4px;line-height:4px;font-size:0;">&nbsp;</td></tr>

  <tr><td style="padding:26px 28px 0 28px;">
    <span style="display:inline-block;background:{{ accent }};color:#ffffff;font-size:11px;
                 font-weight:700;letter-spacing:.08em;padding:5px 12px;border-radius:999px;">
      ALERTE {{ severity_label|upper }}
    </span>
    <h1 style="margin:14px 0 4px 0;color:#0f172a;font-size:20px;line-height:1.3;">
      {{ node_code }} — {{ node_name }}
    </h1>
    <p style="margin:0;color:#64748b;font-size:14px;">
      Incident détecté par la supervision le {{ detected_at }}.
    </p>
  </td></tr>

  <tr><td style="padding:18px 28px 0 28px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
      {% for label, value in rows %}
      <tr>
        <td style="padding:10px 0;border-bottom:1px solid #e2e8f0;color:#64748b;
                   font-size:13px;white-space:nowrap;">{{ label }}</td>
        <td style="padding:10px 0 10px 16px;border-bottom:1px solid #e2e8f0;color:#0f172a;
                   font-size:14px;font-weight:600;text-align:right;">{{ value }}</td>
      </tr>
      {% endfor %}
    </table>
  </td></tr>

  {% if description %}
  <tr><td style="padding:20px 28px 0 28px;">
    <div style="color:#64748b;font-size:12px;text-transform:uppercase;
                letter-spacing:.06em;margin-bottom:8px;">Description</div>
    <div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;
                padding:14px 16px;color:#334155;font-size:14px;line-height:1.55;">
      {{ description }}
    </div>
  </td></tr>
  {% endif %}

  {% if dashboard_url %}
  <tr><td style="padding:24px 28px 4px 28px;" align="center">
    <a href="{{ dashboard_url }}/global"
       style="display:inline-block;background:#0f172a;color:#ffffff;text-decoration:none;
              font-size:14px;font-weight:600;padding:12px 28px;border-radius:8px;">
      Ouvrir le dashboard NOC
    </a>
  </td></tr>
  {% endif %}

  <tr><td style="padding:24px 28px 26px 28px;">
    <p style="margin:0;color:#94a3b8;font-size:12px;line-height:1.5;
              border-top:1px solid #e2e8f0;padding-top:16px;">
      Message automatique du NOC Dashboard ANPTIC — merci de ne pas y répondre.
    </p>
  </td></tr>

</table>
</td></tr>
</table>
</body>
</html>
