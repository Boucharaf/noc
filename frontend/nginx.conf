# Serveur du conteneur frontend.
#
# Il ne se contente pas de servir les fichiers statiques : il relaie aussi
# /api et /ws vers le backend. Sans cela, le conteneur frontend n'est
# utilisable QUE derrière la passerelle nginx du projet — et un
# `docker compose up` suivi d'un accès direct au frontend donnerait une
# application qui charge, puis échoue sur chaque requête. Les deux
# niveaux de proxy sont cohérents ; le relais interne est simplement le
# plus court chemin.
server {
    listen 80;
    server_name _;

    # Résolveur DNS de Docker + proxy_pass par VARIABLE : sans cela nginx
    # met en cache l'IP du backend au démarrage, et un simple
    # `docker compose up -d backend` (nouvelle IP) fait répondre 502 à
    # toute l'API jusqu'au redémarrage manuel de ce conteneur.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Compression : le bundle JS fait ~700 Ko non compressés, et une
    # partie des postes de supervision régionaux sont en liaison lente.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Application monopage : toute URL inconnue renvoie index.html, sinon
    # un rechargement (F5) sur /equipements/42 donnerait un 404 alors que
    # la route existe côté client.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Le service worker ne doit jamais être servi depuis le cache HTTP :
    # un sw.js périmé continuerait de servir un ancien bundle même après
    # un déploiement.
    location = /sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Les assets versionnés (hash dans le nom) peuvent être mis en cache
    # sans limite : leur nom change à chaque build.
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        # Sans composant d'URI : l'URI d'origine est transmise telle
        # quelle, /api/... reste /api/...
        set $api_upstream http://backend:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # La génération d'un rapport mensuel (PDF + DOCX) peut dépasser la
        # minute sur un gros parc ; le défaut de 60 s la couperait.
        proxy_read_timeout 300s;
    }

    # Flux d'alertes temps réel : l'en-tête Upgrade est indispensable,
    # sans lui la poignée de main WebSocket échoue en 400 et le dashboard
    # bascule en repli par interrogation périodique sans le dire.
    location /ws/ {
        set $ws_upstream http://backend:8000;
        proxy_pass $ws_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Le backend envoie un battement de cœur toutes les 20 s ; 120 s
        # laisse la marge nécessaire sans garder de sockets mortes.
        proxy_read_timeout 120s;
    }
}
