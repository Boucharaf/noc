# Laboratoire Nagios du NOC — monté dans /opt/nagios/etc/conf.d/ du service
# `nagios` (docker-compose.yml, profils « nagios » et « tools »).
#
# Même principe que tools/provision/provision.py : aucune donnée fictive.
# Chaque hôte est un conteneur qui tourne réellement sur le réseau compose
# `default`, sondé par une vraie commande Nagios (check_ping, check_http,
# check_tcp). Un conteneur arrêté produit une vraie alerte DOWN.
#
# Noms et alias en ASCII : Nagios refuse au démarrage les caractères de
# illegal_object_name_chars (parenthèses, virgule…), et objectjson.cgi plante
# (HTTP 500) sur un alias accentué — voir integrations/nagios.py.
#
# Le frontend n'est pas déclaré : il n'est pas sur le réseau `default`, la
# sonde le verrait toujours DOWN et l'alerte mentirait.
#
# Le groupe « Site/Laboratoire » suit la convention de localisation lue par
# integrations/nagios.py (comme pour Zabbix et Centreon).

define hostgroup {
    hostgroup_name  Site/Laboratoire
    alias           Laboratoire local du NOC
}

define host {
    use             linux-server
    host_name       noc-backend
    alias           Application NOC - API
    address         backend
    hostgroups      Site/Laboratoire
}

define host {
    use             linux-server
    host_name       noc-redis
    alias           Cache d'etat du NOC
    address         redis
    hostgroups      Site/Laboratoire
}

define host {
    use             linux-server
    host_name       noc-postgres
    alias           Base des donnees propres au NOC
    address         postgres
    hostgroups      Site/Laboratoire
}

define host {
    use             linux-server
    host_name       noc-collector
    alias           Collecteur du NOC
    address         collector
    hostgroups      Site/Laboratoire
}

define service {
    use                     generic-service
    host_name               noc-backend
    service_description     API NOC - vivacite
    check_command           check_http!-p 8000 -u /api/health/live
}

define service {
    use                     generic-service
    host_name               noc-backend
    service_description     API NOC - fraicheur de la collecte
    check_command           check_http!-p 8000 -u /api/health
}

define service {
    use                     generic-service
    host_name               noc-redis
    service_description     Redis TCP 6379
    check_command           check_tcp!6379
}

define service {
    use                     generic-service
    host_name               noc-postgres
    service_description     PostgreSQL TCP 5432
    check_command           check_tcp!5432
}
